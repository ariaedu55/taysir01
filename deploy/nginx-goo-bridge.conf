# taysir.goo-bridge.com : site Taysir Orientation Voyage (PHP 8.4 natif, /home/jomas/taysir).
# Installé dans /usr/local/apps/nginx/etc/conf.d/taysir.goo-bridge.com.conf sur le VPS Webuzo.
# Virtual host autonome, hors du fichier régénéré par Webuzo (webuzoVH.conf) : PHP-FPM direct, sans Apache
# ni cache proxy (l'espace client ne doit jamais être servi depuis un cache partagé).
# Certificat : acme.sh (root), renouvelé automatiquement, installé dans /etc/ssl/taysir/.
# Voir docs/deploiement-vps.md.

server {
	listen		62.171.190.193:80;
	server_name	taysir.goo-bridge.com;
	root		/home/jomas/taysir/public;

	# Renouvellement Let's Encrypt
	location ^~ /.well-known/acme-challenge/ {
		default_type text/plain;
		allow all;
	}

	location / {
		return 301 https://taysir.goo-bridge.com$request_uri;
	}

	error_log	/usr/local/apps/nginx/var/log/taysir.goo-bridge.com.err;
	access_log	/usr/local/apps/nginx/var/log/taysir.goo-bridge.com.log main;
}

server {
	listen		62.171.190.193:443 ssl;
	http2		on;
	server_name	taysir.goo-bridge.com;
	root		/home/jomas/taysir/public;
	index		index.php;
	charset		utf-8;

	ssl_certificate		/etc/ssl/taysir/taysir.goo-bridge.com.fullchain.pem;
	ssl_certificate_key	/etc/ssl/taysir/taysir.goo-bridge.com.key;

	# Envoi de documents avec les demandes : 3 fichiers de 5 Mo (public/.user.ini)
	client_max_body_size	20m;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	gzip			on;
	gzip_vary		on;
	gzip_comp_level		5;
	gzip_min_length		1024;
	gzip_types		text/css application/javascript application/json image/svg+xml text/plain application/xml;

	location ^~ /.well-known/acme-challenge/ {
		default_type text/plain;
		allow all;
	}

	# Fichiers cachés (.htaccess, .user.ini, .git…) : jamais servis
	location ~ /\. {
		deny all;
	}

	# Images et polices : cache long ; CSS et JS : une semaine
	location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
		expires 180d;
		add_header Cache-Control "public, immutable";
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		access_log off;
		try_files $uri =404;
	}
	location ~* \.(?:css|js)$ {
		expires 7d;
		add_header Cache-Control "public";
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		access_log off;
		try_files $uri =404;
	}

	# Contrôleur frontal
	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /index.php {
		fastcgi_pass		unix:/usr/local/apps/php84/var/fpm-jomas.sock;
		include			fastcgi_params;
		fastcgi_param		SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		fastcgi_param		DOCUMENT_ROOT $realpath_root;
		fastcgi_param		HTTPS on;
		fastcgi_read_timeout	60s;
	}

	# Aucun autre script PHP exécutable depuis le web
	location ~ \.php$ {
		return 404;
	}

	error_log	/usr/local/apps/nginx/var/log/taysir.goo-bridge.com.err;
	access_log	/usr/local/apps/nginx/var/log/taysir.goo-bridge.com.log main;
}
