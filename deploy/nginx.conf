# Nginx : site Taysir Orientation Voyage (voir docs/deploiement-vps.md).
#
# Installation sur le VPS :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/taysir
#   (adapter server_name, root et la version de PHP-FPM ci-dessous)
#   sudo ln -s /etc/nginx/sites-available/taysir /etc/nginx/sites-enabled/taysir
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d taysir-orientation.com -d www.taysir-orientation.com
#
# Seul le dossier public/ est exposé : app/, config/, database/ et storage/ (sessions, documents des clients)
# restent hors de la racine web.

server {
    listen 80;
    listen [::]:80;
    server_name taysir-orientation.com www.taysir-orientation.com;

    root /var/www/taysir/public;
    index index.php;
    charset utf-8;

    # Envoi de documents avec les demandes : 3 fichiers de 5 Mo (public/.user.ini).
    client_max_body_size 20m;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression du texte (les images WebP sont déjà compressées)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Fichiers cachés (.htaccess, .user.ini, .git…) : jamais servis
    location ~ /\. {
        deny all;
    }

    # Images, polices, CSS et JS : cache long (vider le cache navigateur en renommant ou avec ?v= si besoin)
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 180d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Contrôleur frontal : toute adresse qui n'est pas un fichier passe par index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Aucun autre script PHP n'est exécutable depuis le web
    location ~ \.php$ {
        return 404;
    }
}
